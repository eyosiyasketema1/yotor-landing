<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yotor — Church Management System</title>
<link rel="icon" type="image/svg+xml" href="assets/yotor-logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet" />
<style>
  /* ===================== DESIGN TOKENS (from Figma) ===================== */
  :root {
    /* Colors */
    --color-yotor-primary: #00b8c2;
    --color-black: #04071e;
    --color-border-soft: #ecf1f8;
    --color-border-button: #ebebeb;
    --color-muted: #737373;
    --color-primary-a: #1f1f1f;
    --color-primary-b: #ffffff;
    --color-text-en: #0b3234;
    --color-white: #ffffff;

    /* Typography */
    --fs-link: 14px;
    --lh-link: 20px;
    --tracking-link: -0.28px;

    /* Radii */
    --r-button: 8px;
    --r-pill: 1000px;

    /* Spacing */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-6: 24px;

    /* Layout */
    --nav-inner-w: 1160px;
    --nav-inner-h: 56px;
  }

  /* ===================== RESET ===================== */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    min-height: 100%;
  }

  body {
    font-family: 'General Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--color-white);
    color: var(--color-black);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  img,
  svg {
    display: block;
  }

  /* ===================== NAVIGATION ===================== */
  .nav {
    border-bottom: 1px solid var(--color-border-soft);
    padding: var(--sp-2);
    display: flex;
    justify-content: center;
    background: var(--color-white);
    position: relative;
  }

  .nav__inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--nav-inner-h);
    width: 100%;
    max-width: var(--nav-inner-w);
    padding: 6px var(--sp-4);
  }

  .nav__group {
    display: flex;
    align-items: center;
    gap: var(--sp-6);
    height: 100%;
  }

  .nav__logo {
    width: 64px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .nav__logo-img {
    width: 48px;
    height: 39px;
    object-fit: contain;
    display: block;
  }

  .nav__links {
    display: flex;
    align-items: center;
    height: 100%;
  }

  .nav__link {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--sp-2) var(--sp-4);
    height: 100%;
    font-family: 'General Sans', 'Inter', sans-serif;
    font-weight: 500;
    font-size: var(--fs-link);
    line-height: var(--lh-link);
    letter-spacing: var(--tracking-link);
    color: var(--color-muted);
    white-space: nowrap;
    transition: color 0.15s ease;
  }

  .nav__link:hover {
    color: var(--color-yotor-primary);
  }

  .nav__link--active {
    color: var(--color-yotor-primary);
  }

  .nav__actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--sp-4);
    height: 48px;
  }

  .nav__lang {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    padding: var(--sp-2);
    border-radius: var(--r-pill);
    flex-shrink: 0;
  }

  .nav__lang-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .nav__lang-icon img {
    width: 100%;
    height: 100%;
  }

  .nav__lang-text {
    font-family: 'Poppins', 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    line-height: 1.2;
    color: var(--color-text-en);
    white-space: nowrap;
  }

  .nav__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 24px;
    font-family: 'General Sans', 'Inter', sans-serif;
    font-weight: 500;
    font-size: var(--fs-link);
    line-height: var(--lh-link);
    letter-spacing: var(--tracking-link);
    border-radius: var(--r-button);
    white-space: nowrap;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .nav__btn--login {
    height: 48px;
    border: 1px solid var(--color-border-button);
    background: var(--color-white);
    color: var(--color-primary-a);
  }

  .nav__btn--login:hover {
    background: #f6f6f6;
  }

  .nav__btn--cta {
    height: 46px;
    background: var(--color-yotor-primary);
    color: var(--color-primary-b);
    border: none;
  }

  .nav__btn--cta:hover {
    background: #009ba4;
  }

  /* Hamburger */
  .nav__toggle {
    display: none;
    width: 44px;
    height: 44px;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-button);
    flex-shrink: 0;
  }

  .nav__toggle-icon,
  .nav__toggle-icon::before,
  .nav__toggle-icon::after {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--color-primary-a);
    border-radius: 2px;
    transition: transform 0.3s ease, opacity 0.2s ease, top 0.3s ease;
  }

  .nav__toggle-icon {
    position: relative;
  }

  .nav__toggle-icon::before,
  .nav__toggle-icon::after {
    content: '';
    position: absolute;
    left: 0;
  }

  .nav__toggle-icon::before {
    top: -7px;
  }

  .nav__toggle-icon::after {
    top: 7px;
  }

  .nav[data-open='true'] .nav__toggle-icon {
    background: transparent;
  }

  .nav[data-open='true'] .nav__toggle-icon::before {
    top: 0;
    transform: rotate(45deg);
  }

  .nav[data-open='true'] .nav__toggle-icon::after {
    top: 0;
    transform: rotate(-45deg);
  }

  /* ===================== RESPONSIVE — TABLET (≤1024px) ===================== */
  @media (max-width: 1024px) {
    .nav__toggle {
      display: inline-flex;
    }

    .nav__links {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--color-white);
      border-bottom: 1px solid var(--color-border-soft);
      flex-direction: column;
      align-items: stretch;
      height: auto;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      z-index: 10;
    }

    .nav[data-open='true'] .nav__links {
      max-height: 320px;
    }

    .nav__link {
      width: 100%;
      justify-content: flex-start;
      padding: 14px 24px;
      height: auto;
    }

    .nav__group {
      gap: var(--sp-4);
    }

    .nav__lang,
    .nav__btn--login {
      display: none;
    }
  }

  /* ===================== RESPONSIVE — MOBILE (≤768px) ===================== */
  @media (max-width: 768px) {
    .nav__inner {
      padding: 6px 12px;
    }

    .nav__btn--cta {
      height: 40px;
      padding: 10px 16px;
      font-size: 13px;
    }

    .nav__logo {
      width: 56px;
    }

    .nav__logo-img {
      width: 44px;
      height: 36px;
    }
  }
</style>
</head>
<body>

<!-- ===================== NAVIGATION ===================== -->
<header class="nav" id="nav" data-open="false">
  <div class="nav__inner">
    <div class="nav__group">
      <a href="#" class="nav__logo" aria-label="Yotor home">
        <img class="nav__logo-img" src="assets/yotor-logo.svg" alt="Yotor logo" width="48" height="39" />
      </a>

      <nav class="nav__links" id="navLinks" aria-label="Primary">
        <a href="#" class="nav__link nav__link--active">Home</a>
        <a href="#" class="nav__link">Product</a>
        <a href="#" class="nav__link">Pricing</a>
        <a href="#" class="nav__link">How it works</a>
      </nav>
    </div>

    <div class="nav__actions">
      <div class="nav__lang" aria-label="Language: English">
        <span class="nav__lang-icon" aria-hidden="true">
          <img src="assets/Globe.svg" alt="" width="20" height="20" />
        </span>
        <span class="nav__lang-text">EN</span>
      </div>

      <button class="nav__btn nav__btn--login" type="button">Log in</button>
      <button class="nav__btn nav__btn--cta" type="button">Get Started for free</button>

      <button
        class="nav__toggle"
        type="button"
        id="navToggle"
        aria-controls="navLinks"
        aria-expanded="false"
        aria-label="Toggle navigation menu"
      >
        <span class="nav__toggle-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>

<main>
  <!-- More sections will be added here as we build them -->
</main>

<script>
  (function () {
    var nav = document.getElementById('nav');
    var toggle = document.getElementById('navToggle');
    var links = document.getElementById('navLinks');
    if (!nav || !toggle || !links) return;

    toggle.addEventListener('click', function () {
      var open = nav.getAttribute('data-open') === 'true';
      nav.setAttribute('data-open', String(!open));
      toggle.setAttribute('aria-expanded', String(!open));
    });

    links.querySelectorAll('.nav__link').forEach(function (link) {
      link.addEventListener('click', function () {
        nav.setAttribute('data-open', 'false');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  })();
</script>

</body>
</html>
